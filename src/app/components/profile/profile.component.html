<section>
  <h2>История расчетов</h2>
  <div>
    @let history = historyList();

    @if (history.length === 0) {
      <p class="empty-message">История пока пуста...</p>
    } @else {
      @for (item of history; track $index) {
        <p>
          @let currency = item.currency;

          {{ item.bill }} {{ currency }} — {{ item.tip }} {{ currency }}
        </p>
      }
    }
  </div>
</section>
